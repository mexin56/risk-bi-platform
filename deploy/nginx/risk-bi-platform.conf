# Risk BI platform: static Vite build plus local FastAPI proxy.
location = /risk-bi-platform {
    return 301 /risk-bi-platform/;
}

location /risk-bi-platform/ {
    root /var/www/sites;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /risk-bi-platform/index.html;
}

# Hashed resources can be cached; send compressed JavaScript and CSS to browsers.
location ^~ /risk-bi-platform/assets/ {
    root /var/www/sites;
    try_files $uri =404;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css;
    gzip_vary on;
    gzip_proxied any;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /api {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

location /api/ {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}
