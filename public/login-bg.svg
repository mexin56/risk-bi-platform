<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F2E6"/>
      <stop offset="0.5" stop-color="#F4EDDD"/>
      <stop offset="1" stop-color="#EEE4CF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 250) scale(560)">
      <stop stop-color="#537D96" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#537D96" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1280 780) scale(600)">
      <stop stop-color="#8B2C1F" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#8B2C1F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#8F867B" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="lineA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A433C" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#4A433C" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#537D96" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="fillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#537D96" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#537D96" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#537D96" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A6B4A" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.38  0 0 0 0 0.34  0 0 0 0.05 0"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F2E6" stop-opacity="0"/>
      <stop offset="1" stop-color="#F8F2E6" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glowA)"/>
  <rect width="1600" height="1000" fill="url(#glowB)"/>
  <!-- 纸纹颗粒 -->
  <rect width="1600" height="1000" filter="url(#grain)"/>

  <!-- 墨线数据曲线 -->
  <path d="M-20 720 C 140 690, 220 760, 380 716 C 520 678, 600 740, 760 700 C 900 664, 980 724, 1140 682 C 1240 656, 1360 690, 1460 648 L 1620 600 L 1620 1000 L -20 1000 Z" fill="url(#fillA)"/>
  <path d="M-20 720 C 140 690, 220 760, 380 716 C 520 678, 600 740, 760 700 C 900 664, 980 724, 1140 682 C 1240 656, 1360 690, 1460 648 L 1620 600" stroke="url(#lineA)" stroke-width="2.5"/>
  <path d="M-20 780 C 160 810, 300 760, 480 792 C 640 820, 780 776, 960 802 C 1120 824, 1260 792, 1620 814" stroke="url(#lineB)" stroke-width="1.5" stroke-dasharray="4 8"/>

  <!-- 右上环形图（印章青 / 墨绿 / 朱砂） -->
  <g transform="translate(1300 250)">
    <circle r="120" stroke="#B8B0A3" stroke-opacity="0.3" stroke-width="24"/>
    <circle r="120" stroke="#537D96" stroke-opacity="0.55" stroke-width="24" stroke-dasharray="420 335" transform="rotate(-90)"/>
    <circle r="120" stroke="#4A6B4A" stroke-opacity="0.45" stroke-width="24" stroke-dasharray="170 585" transform="rotate(56)"/>
    <circle r="120" stroke="#8B2C1F" stroke-opacity="0.35" stroke-width="24" stroke-dasharray="90 665" transform="rotate(150)"/>
    <circle cx="0" cy="0" r="40" fill="#FBF7EE" stroke="#B8B0A3" stroke-opacity="0.4"/>
  </g>

  <!-- 曲线数据点 -->
  <g fill="#537D96">
    <circle cx="380" cy="716" r="4"/>
    <circle cx="760" cy="700" r="4"/>
  </g>
  <circle cx="1140" cy="682" r="4" fill="#8B2C1F"/>
  <circle cx="600" cy="740" r="3.5" fill="#4A433C" fill-opacity="0.6"/>
  <circle cx="980" cy="724" r="3.5" fill="#4A433C" fill-opacity="0.6"/>

  <!-- 左下散点矩阵 -->
  <g stroke="#8F867B" stroke-opacity="0.35" stroke-width="1">
    <path d="M120 900 H200"/><path d="M120 900 V820"/>
    <path d="M340 900 H420"/><path d="M340 900 V820"/>
    <path d="M560 900 H640"/><path d="M560 900 V820"/>
    <path d="M120 700 H200"/><path d="M120 700 V620"/>
    <path d="M340 700 H420"/><path d="M340 700 V620"/>
  </g>

  <!-- 朱砂印章 -->
  <g transform="translate(1330 560) rotate(-8)">
    <rect x="-36" y="-38" width="72" height="76" rx="8" fill="#8B2C1F" opacity="0.92"/>
    <text x="0" y="-4" text-anchor="middle" fill="#FBF7EE" font-size="22" font-family="'STKaiti','KaiTi','SimSun',serif" font-weight="600" letter-spacing="5">风控</text>
    <text x="0" y="20" text-anchor="middle" fill="#FBF7EE" font-size="10" font-family="system-ui, sans-serif" letter-spacing="2" opacity="0.9">BI</text>
  </g>

  <!-- 装饰文字 -->
  <text x="1508" y="880" fill="#8F867B" fill-opacity="0.35" font-family="system-ui, sans-serif" font-size="15" letter-spacing="10" text-anchor="end">RISK CONTROL</text>

  <!-- 底部柔光渐隐 -->
  <rect width="1600" height="1000" fill="url(#fade)"/>
</svg>
